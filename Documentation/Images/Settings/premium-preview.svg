<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Full-width premium animation preview</title>
  <desc id="desc">A wide TYPO3 backend preview component with GreenSock branding, motion controls and headless-ready badges.</desc>
  <defs>
    <linearGradient id="surface" x1="64" y1="76" x2="1336" y2="564" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfccb"/>
      <stop offset=".38" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 136) rotate(44) scale(320 220)">
      <stop stop-color="#84cc16" stop-opacity=".36"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1138 226) rotate(126) scale(300 220)">
      <stop stop-color="#0f766e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-16%" width="120%" height="132%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1400" height="640" fill="#111827"/>
  <rect x="64" y="76" width="1272" height="488" rx="18" fill="url(#surface)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="64" y="76" width="1272" height="488" rx="18" fill="url(#glowA)"/>
  <rect x="64" y="76" width="1272" height="488" rx="18" fill="url(#glowB)"/>

  <g transform="translate(100 110)">
    <rect width="116" height="40" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="58" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#134e4a">Preview</text>
  </g>

  <g transform="translate(1082 102)">
    <image href="../../../Resources/Public/Images/gsap-greensock.svg" x="0" y="0" width="48" height="56" preserveAspectRatio="xMidYMid meet"/>
    <circle cx="24" cy="28" r="22" fill="#84cc16"/>
    <path d="M10 32c10-6 16-16 28-18-4 9-10 18-22 25 4-1 10-3 18-8-6 10-14 16-26 17 4-5 6-9 2-16z" fill="#0f172a" opacity=".9"/>
    <text x="68" y="25" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#334155">GreenSock</text>
    <text x="68" y="50" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Motion-safe and headless-ready</text>
  </g>

  <g transform="translate(100 188)">
    <rect width="332" height="292" rx="12" fill="#ffffff" fill-opacity=".56" stroke="#94a3b8" stroke-opacity=".45"/>
    <rect x="28" y="28" width="108" height="26" rx="13" fill="#84cc16" fill-opacity=".22"/>
    <text x="82" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f766e">ScrollTrigger</text>
    <text x="28" y="100" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#111827">Motion preview</text>
    <text x="28" y="142" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">GSAP data for TYPO3 and APIs.</text>
    <text x="28" y="170" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Reduced motion stays respected.</text>
    <rect x="28" y="220" width="104" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="80" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b">GSAP</text>
    <rect x="144" y="220" width="152" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="220" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b">Headless data</text>
  </g>

  <g transform="translate(464 188)">
    <rect width="836" height="292" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="72" y1="58" x2="764" y2="58" stroke="#0f766e" stroke-width="2" opacity=".55"/>
    <circle cx="178" cy="58" r="8" fill="#0f766e"/>
    <circle cx="658" cy="58" r="8" fill="#0f766e"/>
    <g transform="translate(206 100)">
      <rect width="424" height="132" rx="12" fill="#ffffff" stroke="#94a3b8"/>
      <rect x="18" y="18" width="120" height="96" rx="8" fill="#0f766e"/>
      <rect x="18" y="18" width="120" height="96" rx="8" fill="url(#glowA)" opacity=".85"/>
      <path d="M36 96c22-44 70-44 92 0z" fill="#ffffff" opacity=".45"/>
      <circle cx="54" cy="50" r="16" fill="#ffffff" opacity=".78"/>
      <circle cx="108" cy="88" r="10" fill="#ffffff" opacity=".78"/>
      <rect x="170" y="48" width="88" height="12" rx="6" fill="#0f766e"/>
      <rect x="170" y="80" width="214" height="14" rx="7" fill="#94a3b8" opacity=".58"/>
      <rect x="170" y="108" width="154" height="14" rx="7" fill="#94a3b8" opacity=".58"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748b">
      <rect x="40" y="240" width="74" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="77" y="260" text-anchor="middle">GSAP</text>
      <rect x="126" y="240" width="166" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="209" y="260" text-anchor="middle">Reduced motion</text>
      <rect x="304" y="240" width="144" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="376" y="260" text-anchor="middle">API data</text>
    </g>
  </g>
</svg>
